<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mídia - Wireless Drive</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gradient-start: #a78bfa;
      --gradient-end: #c084fc;
      --bg-primary: #0a0a0f;
      --bg-secondary: #13111c;
      --bg-card: #1c1825;
      --accent: #a78bfa;
      --accent-hover: #c084fc;
      --accent-secondary: #e9d5ff;
      --text-primary: #f3f4f6;
      --text-secondary: #c4b5fd;
      --border: rgba(167, 139, 250, 0.2);
      --shadow: rgba(167, 139, 250, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 30%, rgba(167, 139, 250, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 48%, rgba(99, 102, 241, 0.03) 50%, transparent 52%), linear-gradient(-45deg, transparent 48%, rgba(139, 92, 246, 0.03) 50%, transparent 52%);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, 30px) rotate(0deg); }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 24px;
      margin-bottom: 48px;
      background: linear-gradient(135deg, rgba(28, 24, 37, 0.95) 0%, rgba(19, 17, 28, 0.95) 100%);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 2px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 1px rgba(167, 139, 250, 0.5);
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      overflow: hidden;
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #a78bfa, #c084fc, #e9d5ff, #c084fc, #a78bfa);
      background-size: 300% 100%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .site-header h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      background: linear-gradient(135deg, #a78bfa 0%, #e9d5ff 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-header h1::before {
      content: '📸';
      font-size: 1.3em;
      filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.6));
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.8)); }
    }

    .site-header h1 a {
      text-decoration: none;
      background: linear-gradient(135deg, #a78bfa 0%, #e9d5ff 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-header nav {
      display: flex;
      gap: 12px;
    }

    .site-header nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .site-header nav a.back-link {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
    }

    .site-header nav a.delete-link {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .site-header nav a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }

    .site-header nav a:hover::before {
      left: 100%;
    }

    .site-header nav a.back-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(192, 132, 252, 0.6);
    }

    .site-header nav a.delete-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.6);
    }

    .site-header nav a:active {
      transform: translateY(-1px);
    }

    main {
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.2s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: linear-gradient(135deg, rgba(28, 24, 37, 0.95) 0%, rgba(19, 17, 28, 0.95) 100%);
      backdrop-filter: blur(10px);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #a78bfa, #c084fc, #e9d5ff, #c084fc, #a78bfa);
      background-size: 300% 100%;
      animation: gradientShift 4s ease infinite;
    }

    .card h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--text-primary);
      font-weight: 800;
      line-height: 1.2;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .title-row h1 {
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .edit-icon-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, 0.25);
      background: rgba(167, 139, 250, 0.1);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 2px;
    }

    .edit-icon-btn:hover {
      background: rgba(167, 139, 250, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(167, 139, 250, 0.25);
    }

    .edit-form {
      display: none;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
      padding: 20px;
      background: rgba(167, 139, 250, 0.05);
      border: 1px solid rgba(167, 139, 250, 0.15);
      border-radius: 14px;
    }

    .edit-form label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 6px;
      display: block;
    }

    .edit-form input,
    .edit-form textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    .edit-form input:focus,
    .edit-form textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .edit-form textarea {
      min-height: 90px;
      line-height: 1.5;
    }

    .edit-form .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn.save {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: white;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .btn.save:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.45);
    }

    .btn.cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn.cancel:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.14);
    }

    .muted {
      color: var(--text-secondary);
      opacity: 0.9;
      margin-bottom: 24px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .media-container {
      margin: 24px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .media-container video, .media-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn.download {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white;
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
    }

    .btn.download:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(192, 132, 252, 0.6);
    }

    .btn.generate {
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(167, 139, 250, 0.18));
      color: white;
      border: 1px solid rgba(167, 139, 250, 0.25);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);
    }

    .btn.generate:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(167, 139, 250, 0.4);
    }

    .btn.delete-thumb {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.18), rgba(239, 68, 68, 0.28));
      color: white;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.18);
    }

    .btn.delete-thumb:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.36);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    a.download {
      display: inline-block;
      text-decoration: none;
    }

    .file-info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px solid rgba(167, 139, 250, 0.15);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .info-item {
      background: rgba(167, 139, 250, 0.05);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, 0.1);
    }

    .info-item strong {
      display: block;
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .info-item span {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      .site-header { flex-direction: column; gap: 16px; text-align: center; padding: 20px; margin-bottom: 32px; }
      .site-header nav { width: 100%; flex-direction: column; }
      .site-header nav a { width: 100%; justify-content: center; }
      .card { padding: 28px; border-radius: 20px; }
      .card h1 { font-size: 1.6rem; }
      .actions { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
      .file-info { grid-template-columns: 1fr; }
    }

    .app-toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      pointer-events: none;
    }

    .app-toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--bg-card, #1c1825);
      border: 1px solid var(--border, rgba(167, 139, 250, 0.2));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      color: var(--text-primary, #f3f4f6);
      font-size: 0.9rem;
      line-height: 1.4;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .app-toast.visible {
      transform: translateX(0);
      opacity: 1;
    }

    .app-toast-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .app-toast-message {
      flex: 1;
      word-break: break-word;
    }

    .app-toast-close {
      background: none;
      border: none;
      color: var(--text-secondary, #c4b5fd);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }

    .app-toast-close:hover {
      color: var(--text-primary, #f3f4f6);
    }

    .app-toast.error { border-color: rgba(248, 113, 113, 0.45); }
    .app-toast.error .app-toast-icon { color: #f87171; }

    .app-toast.warning { border-color: rgba(251, 191, 36, 0.45); }
    .app-toast.warning .app-toast-icon { color: #fbbf24; }

    .app-toast.success { border-color: rgba(74, 222, 128, 0.45); }
    .app-toast.success .app-toast-icon { color: #4ade80; }

    .app-toast.info { border-color: rgba(167, 139, 250, 0.45); }
    .app-toast.info .app-toast-icon { color: var(--accent, #a78bfa); }

    @media (max-width: 480px) {
      .app-toast-container {
        left: 16px;
        right: 16px;
        top: 16px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  
  <header class="site-header">
    <h1><a href="/">Wireless Drive</a></h1>
    <nav>
      <a href="/website/dashboard" class="back-link">← Voltar</a>
      <a href="#" id="deleteBtn" class="delete-link">🗑️ Excluir</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="title-row">
        <h1 id="mediaTitle">Carregando...</h1>
        <button class="edit-icon-btn" id="editInfoBtn" type="button" title="Editar título">✏️</button>
      </div>
      <div class="muted" id="mediaDate">📅 Carregando...</div>

      <div class="edit-form" id="editForm">
        <div>
          <label for="editTitleInput">Título</label>
          <input type="text" id="editTitleInput" maxlength="255">
        </div>
        <div class="edit-actions">
          <button class="btn save" id="saveInfoBtn" type="button">💾 Salvar</button>
          <button class="btn cancel" id="cancelEditBtn" type="button">Cancelar</button>
        </div>
      </div>

      <div id="mediaContentContainer">
        <div style="font-size:5rem;text-align:center;padding:60px 20px;background:linear-gradient(135deg,rgba(167,139,250,0.08) 0%,rgba(192,132,252,0.08) 100%);border-radius:16px;margin:24px 0;filter:drop-shadow(0 4px 20px rgba(167,139,250,0.2))">📄</div>
      </div>

      <div class="actions">
        <a class="download" href="#" id="downloadLink">
          <button class="btn download">⬇️ Baixar</button>
        </a>
        <button class="btn generate" id="generateThumbnailBtn" type="button" style="display:none">🖼️ Gerar thumbnail</button>
        <button class="btn delete-thumb" id="deleteThumbnailBtn" type="button" style="display:none">🗑️ Deletar thumbnail</button>
      </div>

      <div class="file-info">
        <div class="info-item">
          <strong>Tipo</strong>
          <span id="mediaType">unknown</span>
        </div>
        <div class="info-item">
          <strong>Formato</strong>
          <span id="mediaMimeType">unknown</span>
        </div>
        <div class="info-item">
          <strong>ID</strong>
          <span id="mediaID">#0</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://192.168.0.236:8085';
    let currentMediaData = null;

    window.addEventListener("DOMContentLoaded", function() {
      gsap.from(".site-header > *", {
        opacity: 0,
        y: 20,
        duration: 0.8,
        stagger: 0.1,
        ease: "power2.out",
        delay: 0.3
      });

      gsap.from('.card', {
        opacity: 0,
        y: 30,
        duration: 0.8,
        delay: 0.6,
        ease: 'power3.out'
      });

      gsap.from('.card > *', {
        opacity: 0,
        y: 15,
        duration: 0.6,
        stagger: 0.08,
        delay: 0.8,
        ease: 'power2.out'
      });

      document.querySelectorAll('.muted').forEach(function(el){
        var txt = el.textContent.replace(/^📅\s*/, '').trim();
        var d = new Date(txt);
        if(!isNaN(d.getTime())){
          var opts = { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' };
          try{
            el.textContent = '📅 ' + d.toLocaleString(undefined, opts);
          }catch(e){
            el.textContent = '📅 ' + d.toLocaleDateString();
          }
        }
      });
    });

    var buttons = document.querySelectorAll('.btn, .site-header nav a');
    buttons.forEach(function(btn) {
      btn.addEventListener('mouseenter', function() {
        gsap.to(this, { scale: 1.05, duration: 0.3, ease: 'power2.out' });
      });

      btn.addEventListener('mouseleave', function() {
        gsap.to(this, { scale: 1, duration: 0.3, ease: 'power2.out' });
      });
    });

    function getToastContainer() {
      var el = document.getElementById('appToastContainer');
      if (!el) {
        el = document.createElement('div');
        el.id = 'appToastContainer';
        el.className = 'app-toast-container';
        document.body.appendChild(el);
      }
      return el;
    }

    function showAppAlert(message, type) {
      type = type || 'error';
      var icons = { error: '❌', warning: '⚠️', success: '✅', info: 'ℹ️' };

      var container = getToastContainer();

      var toast = document.createElement('div');
      toast.className = 'app-toast ' + type;
      toast.innerHTML =
        '<div class="app-toast-icon">' + (icons[type] || icons.info) + '</div>' +
        '<div class="app-toast-message"></div>' +
        '<button type="button" class="app-toast-close" aria-label="Fechar">✕</button>';
      toast.querySelector('.app-toast-message').textContent = message;

      container.appendChild(toast);
      requestAnimationFrame(function() {
        toast.classList.add('visible');
      });

      var dismissTimer = setTimeout(dismiss, type === 'error' ? 7000 : 5000);

      function dismiss() {
        clearTimeout(dismissTimer);
        toast.classList.remove('visible');
        setTimeout(function() {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }

      toast.querySelector('.app-toast-close').addEventListener('click', dismiss);
      toast.addEventListener('mouseenter', function() { clearTimeout(dismissTimer); });
      toast.addEventListener('mouseleave', function() { dismissTimer = setTimeout(dismiss, 2000); });
    }

    var authFailureHandled = false;
    function handleAuthFailure(status) {
      if (authFailureHandled) return;
      authFailureHandled = true;

      localStorage.removeItem('authToken');

      showAppAlert(
        status === 403
          ? 'Você não tem permissão para acessar isso. Redirecionando para o login...'
          : 'Sua sessão expirou. Redirecionando para o login...',
        'warning'
      );

      setTimeout(function() {
        window.location.href = '/website/account';
      }, 5000);
    }

    async function authFetch(url, opts = {}) {
      const token = localStorage.getItem('authToken');
      const fullUrl = url.startsWith('http') ? url : API_URL + url;

      opts.headers = {
        ...(opts.headers || {}),
        ...(token ? { Authorization: 'Bearer ' + token } : {})
      };

      const response = await fetch(fullUrl, opts);

      if (response.status === 401 || response.status === 403) {
        handleAuthFailure(response.status);
        // Navigation to the login screen has already been triggered.
        // Return a promise that never resolves to prevent the caller's
        // .then()/.catch() handlers from running afterward (and showing
        // a second error that conflicts with the one above).
        return new Promise(function() {});
      }

      return response;
    }

    function buildStreamSrc(url) {
      return url.startsWith('http') ? url : API_URL + url;
    }

    // HTMLMediaElement doesn't expose the HTTP status of a failed request, 
    // so any playback trouble here is treated as a possible stale-token situation.
    function attachStreamRecovery(playerEl, mediaId) {
      const MAX_CONSECUTIVE_MEDIA_ERRORS = 3;
      const STALLED_DEBOUNCE_MS = 2000;

      let isReloading = false;
      let consecutiveErrorCount = 0;
      let stalledTimer;

      function clearStalledTimer() {
        if (stalledTimer !== undefined) {
          clearTimeout(stalledTimer);
          stalledTimer = undefined;
        }
      }

      function reloadStream() {
        if (isReloading) return;
        isReloading = true;
        clearStalledTimer();

        const resumeTime = playerEl.currentTime;
        const wasPlaying = !playerEl.paused && !playerEl.ended;

        authFetch('/api/media/' + mediaId + '/stream-url')
          .then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
          })
          .then(function(streamData) {
            playerEl.src = buildStreamSrc(streamData.url);

            const resumePlayback = function() {
              playerEl.currentTime = resumeTime;
              if (wasPlaying) {
                playerEl.play().catch(function() { /* autoplay may be blocked; user can press play */ });
              }
              playerEl.removeEventListener('loadedmetadata', resumePlayback);
            };
            playerEl.addEventListener('loadedmetadata', resumePlayback);

            playerEl.load();
          })
          .catch(function(err) {
            console.error('Erro ao renovar a URL de streaming:', err);
            // 401/403 responses are handled centrally by authFetch
            // (notification + redirect to the login screen). If execution
            // reaches this point, it's a different issue -- network outage,
            // 404, 500, etc.
            showAppAlert('Não foi possível renovar o link de streaming. Tente recarregar a página.', 'error');
          })
          .finally(function() {
            isReloading = false;
          });
      }

      playerEl.addEventListener('error', function() {
        consecutiveErrorCount++;
        if (isReloading) return;

        if (consecutiveErrorCount > MAX_CONSECUTIVE_MEDIA_ERRORS) {
          showAppAlert('Não foi possível carregar a mídia após várias tentativas. Atualize a página.', 'error');
          return;
        }

        reloadStream();
      });

      playerEl.addEventListener('canplay', function() {
        consecutiveErrorCount = 0;
        clearStalledTimer();
      });

      playerEl.addEventListener('progress', function() {
        clearStalledTimer();
      });

      playerEl.addEventListener('stalled', function() {
        if (isReloading || stalledTimer !== undefined) return;

        stalledTimer = setTimeout(function() {
          stalledTimer = undefined;
          if (!document.body.contains(playerEl) || isReloading) return;
          reloadStream();
        }, STALLED_DEBOUNCE_MS);
      });
    }

    function getMediaID() {
      const params = new URLSearchParams(window.location.search);
      const idFromQuery = params.get('id');
      if (idFromQuery) return idFromQuery;
    }

    function loadMediaData() {
      const mediaID = getMediaID();

      authFetch('/api/media/' + mediaID)
        .then(function(resp) { return resp.json(); })
        .then(function(data) {

          currentMediaData = data;

          var typeLabels = { video: 'Vídeo', audio: 'Áudio', image: 'Imagem', other: 'Arquivo' };
          document.title = (typeLabels[data.Type] || 'Mídia') + ' - Wireless Drive';

          document.getElementById('mediaTitle').textContent = data.Title;
          document.getElementById('mediaDate').textContent =
            '📅 ' + new Date(data.CreatedAt).toLocaleString();

          document.getElementById('mediaType').textContent = data.Type;
          document.getElementById('mediaMimeType').textContent = data.MimeType;
          document.getElementById('mediaID').textContent = '#' + data.ID;

          document.getElementById('editTitleInput').value = data.Title || '';

          const fileUrl = '/api/media/' + data.ID + '/file';
          const container = document.getElementById('mediaContentContainer');


          if (data.Type === 'video') {

            authFetch('/api/media/' + data.ID + '/stream-url')
              .then(function(resp) {
                return resp.json();
              })
              .then(function(streamData) {

                var videoElement = document.createElement('div');
                videoElement.className = 'media-container';

                videoElement.innerHTML =
                  '<video id="player" controls preload="metadata">' +
                    '<source src="' + API_URL + streamData.url + '" type="' + data.MimeType + '">' +
                    'Seu navegador não suporta o elemento de vídeo.' +
                  '</video>';


                container.innerHTML = '';
                container.appendChild(videoElement);

                attachStreamRecovery(document.getElementById('player'), data.ID);

              })
              .catch(function(err) {
                console.error('Erro ao carregar vídeo:', err);
              });


            document.querySelector('.btn.download').textContent =
              '⬇️ Baixar vídeo';


          } else if (data.Type === 'audio') {

            authFetch('/api/media/' + data.ID + '/stream-url')
              .then(function(resp) {
                return resp.json();
              })
              .then(function(streamData) {

                var audioElement = document.createElement('div');
                audioElement.className = 'media-container';
                audioElement.style.padding = '32px 20px';
                audioElement.style.display = 'flex';
                audioElement.style.flexDirection = 'column';
                audioElement.style.alignItems = 'center';
                audioElement.style.gap = '20px';
                audioElement.style.background = 'linear-gradient(135deg, rgba(167,139,250,0.08) 0%, rgba(192,132,252,0.08) 100%)';

                audioElement.innerHTML =
                  '<div style="font-size:4rem;filter:drop-shadow(0 4px 20px rgba(167,139,250,0.3))">🎧</div>' +
                  '<audio id="player" controls preload="metadata" style="width:100%;max-width:500px">' +
                    '<source src="' + API_URL + streamData.url + '" type="' + data.MimeType + '">' +
                    'Seu navegador não suporta o elemento de áudio.' +
                  '</audio>';

                container.innerHTML = '';
                container.appendChild(audioElement);

                attachStreamRecovery(document.getElementById('player'), data.ID);

              })
              .catch(function(err) {
                console.error('Erro ao carregar áudio:', err);
              });


            document.querySelector('.btn.download').textContent =
              '⬇️ Baixar áudio';


          } else if (data.Type === 'image') {


            authFetch(fileUrl)
              .then(function(resp) {
                return resp.blob();
              })
              .then(function(blob) {

                var blobUrl = window.URL.createObjectURL(blob);

                var imgElement = document.createElement('div');
                imgElement.className = 'media-container';

                imgElement.innerHTML =
                  '<img src="' + blobUrl + '" alt="' + data.Title + '">';


                container.innerHTML = '';
                container.appendChild(imgElement);

              })
              .catch(function(err) {
                console.error('Erro ao carregar imagem:', err);
              });


            document.querySelector('.btn.download').textContent =
              '⬇️ Baixar imagem';


          } else {

            container.innerHTML =
              '<div style="font-size:5rem;text-align:center;padding:60px 20px;background:linear-gradient(135deg,rgba(167,139,250,0.08) 0%,rgba(192,132,252,0.08) 100%);border-radius:16px;margin:24px 0;filter:drop-shadow(0 4px 20px rgba(167,139,250,0.2))">📄</div>';

            document.querySelector('.btn.download').textContent =
              '⬇️ Baixar arquivo';
          }


          document.getElementById('downloadLink').href = '#';
          document.getElementById('downloadLink').download = data.Filename;


          document.getElementById('downloadLink')
              .addEventListener('click', function (e) {

                  e.preventDefault();

                  downloadFileWithAuth(data.ID);

              });

          var generateBtn = document.getElementById('generateThumbnailBtn');
          var deleteThumbBtn = document.getElementById('deleteThumbnailBtn');


          if (data.Type === 'image' || data.Type === 'video' || data.Type === 'audio') {

            if (generateBtn) {

              generateBtn.style.display = 'inline-flex';
              generateBtn.disabled = false;
              generateBtn.textContent = '🖼️ Gerar thumbnail';

              generateBtn.addEventListener('click', function(e) {
                e.preventDefault();
                generateThumbnailForMedia(data.ID);
              });

            }


            if (deleteThumbBtn) {

              deleteThumbBtn.style.display = 'inline-flex';
              deleteThumbBtn.disabled = false;
              deleteThumbBtn.textContent = '🗑️ Deletar thumbnail';

              deleteThumbBtn.addEventListener('click', function(e) {
                e.preventDefault();
                deleteThumbnailForMedia(data.ID);
              });

            }


          } else {

            if (generateBtn) {
              generateBtn.style.display = 'none';
            }

            if (deleteThumbBtn) {
              deleteThumbBtn.style.display = 'none';
            }

          }

        })
        .catch(function(err) {

          console.error('Erro ao carregar mídia:', err);

          document.getElementById('mediaTitle').textContent =
            'Erro ao carregar';

        });
    }
    
    function downloadFileWithAuth(mediaId) {
      authFetch('/api/media/' + mediaId + '/stream-url?type=download')
        .then(function (resp) {
          return resp.json();
        })
        .then(function (streamData) {
          window.location.href = API_URL + streamData.url;
        })
        .catch(function (err) {
          console.error('Erro ao carregar arquivo:', err);
          showAppAlert('Erro ao baixar arquivo: ' + err.message, 'error');
        });
    }

    function generateThumbnailForMedia(mediaID) {
      var generateBtn = document.getElementById('generateThumbnailBtn');
      if (!generateBtn) return;

      generateBtn.disabled = true;
      generateBtn.textContent = '⏳ Gerando...';

      authFetch('/api/media/' + mediaID + '/generate-thumbnail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
        .then(function(resp) {
          return resp.json().then(function(data) {
            if (!resp.ok) {
              throw new Error(data.error || data.message || 'Erro ao gerar thumbnail');
            }
            return data;
          });
        })
        .then(function(data) {
          generateBtn.textContent = '✅ Gerado';
          setTimeout(function() {
            generateBtn.textContent = '🖼️ Gerar thumbnail';
          }, 2500);
        })
        .catch(function(err) {
          showAppAlert('Erro ao gerar thumbnail: ' + err.message, 'error');
          generateBtn.textContent = '↻ Tentar novamente';
        })
        .finally(function() {
          setTimeout(function() {
            generateBtn.disabled = false;
          }, 1000);
        });
    }

    function deleteThumbnailForMedia(mediaID) {
      var deleteThumbBtn = document.getElementById('deleteThumbnailBtn');
      if (!deleteThumbBtn) return;

      if (!confirm('Tem certeza que deseja deletar o thumbnail desta mídia?')) {
        return;
      }

      deleteThumbBtn.disabled = true;
      deleteThumbBtn.textContent = '⏳ Deletando...';

      authFetch('/api/media/' + mediaID + '/delete-thumbnail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
        .then(function(resp) {
          return resp.json().then(function(data) {
            if (!resp.ok) {
              throw new Error(data.error || data.message || 'Erro ao deletar thumbnail');
            }
            return data;
          });
        })
        .then(function(data) {
          deleteThumbBtn.textContent = '✅ Deletado';
          setTimeout(function() {
            deleteThumbBtn.textContent = '🗑️ Deletar thumbnail';
          }, 2500);
        })
        .catch(function(err) {
          showAppAlert('Erro ao deletar thumbnail: ' + err.message, 'error');
          deleteThumbBtn.textContent = '↻ Tentar novamente';
        })
        .finally(function() {
          setTimeout(function() {
            deleteThumbBtn.disabled = false;
          }, 1000);
        });
    }

    window.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        loadMediaData();
      }, 50);
    });

    var editInfoBtn = document.getElementById('editInfoBtn');
    var editForm = document.getElementById('editForm');
    var cancelEditBtn = document.getElementById('cancelEditBtn');
    var saveInfoBtn = document.getElementById('saveInfoBtn');

    if (editInfoBtn) {
      editInfoBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (currentMediaData) {
          document.getElementById('editTitleInput').value = currentMediaData.Title || '';
        }
        editForm.style.display = 'flex';
        document.getElementById('editTitleInput').focus();
      });
    }

    if (cancelEditBtn) {
      cancelEditBtn.addEventListener('click', function(e) {
        e.preventDefault();
        editForm.style.display = 'none';
      });
    }

    if (saveInfoBtn) {
      saveInfoBtn.addEventListener('click', function(e) {
        e.preventDefault();

        const mediaID = getMediaID();
        const newTitle = document.getElementById('editTitleInput').value.trim();

        if (!newTitle) {
          showAppAlert('O título não pode ficar vazio.', 'warning');
          return;
        }

        saveInfoBtn.disabled = true;
        saveInfoBtn.textContent = '⏳ Salvando...';

        authFetch('/api/media/' + mediaID, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle })
        })
          .then(function(resp) {
            return resp.json().then(function(data) {
              if (!resp.ok) {
                throw new Error(data.error || data.message || 'Erro ao atualizar mídia');
              }
              return data;
            });
          })
          .then(function() {
            currentMediaData.Title = newTitle;

            document.getElementById('mediaTitle').textContent = newTitle;

            saveInfoBtn.textContent = '✅ Salvo';
            setTimeout(function() {
              editForm.style.display = 'none';
              saveInfoBtn.textContent = '💾 Salvar';
            }, 900);
          })
          .catch(function(err) {
            showAppAlert('Erro ao atualizar mídia: ' + err.message, 'error');
            saveInfoBtn.textContent = '💾 Salvar';
          })
          .finally(function() {
            setTimeout(function() {
              saveInfoBtn.disabled = false;
            }, 900);
          });
      });
    }

    var deleteBtn = document.getElementById('deleteBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', function(e){
        e.preventDefault();
        if(!confirm('Tem certeza que deseja excluir esta mídia?')) return;
        
        const mediaID = getMediaID();
        
        authFetch('/api/media/' + mediaID, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        })
        .then(function(resp){ return resp.json(); })
        .then(function(data){ 
          if(data && data.message){ 
            window.location.href = '/website/dashboard'; 
          } else { 
            showAppAlert('Erro ao excluir', 'error'); 
          } 
        })
        .catch(function(e){ 
          showAppAlert('Erro ao excluir: ' + e.message, 'error'); 
        });
      });
    }
  </script>
