      // HTMLMediaElement doesn't expose the HTTP status of a failed request, 
      // so any playback trouble here is treated as a possible stale-token situation.
      function attachStreamRecovery(mediaEl, mediaID, overlay) {
        var MAX_CONSECUTIVE_MEDIA_ERRORS = 3;
        var STALLED_DEBOUNCE_MS = 2000;

        var isReloading = false;
        var consecutiveErrorCount = 0;
        var stalledTimer;

        function clearStalledTimer() {
          if (stalledTimer !== undefined) {
            clearTimeout(stalledTimer);
            stalledTimer = undefined;
          }
        }

        function showUnrecoverable() {
          if (currentLightbox !== overlay) return;
          // 401/403 responses are handled centrally by authFetch
          // (notification + redirect to the login screen). If execution
          // reaches this point, it's a different issue -- network outage,
          // 404, 500, etc.
          var errorState = createErrorState(
            i18n.t('errorVideo'),
            function() { openLightboxWithLoading('video', mediaID); }
          );
          overlay.appendChild(errorState);
        }

        function reloadStream() {
          if (currentLightbox !== overlay) return;
          if (isReloading) return;
          isReloading = true;
          clearStalledTimer();

          var resumeTime = mediaEl.currentTime;
          var wasPlaying = !mediaEl.paused && !mediaEl.ended;

          authFetch('/api/media/' + mediaID + '/stream-url')
            .then(function(resp) {
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              return resp.json();
            })
            .then(function(streamData) {
              if (currentLightbox !== overlay) return;

              mediaEl.src = buildStreamSrc(streamData.url);

              var resumePlayback = function() {
                mediaEl.currentTime = resumeTime;
                if (wasPlaying) {
                  mediaEl.play().catch(function() { /* autoplay may be blocked; user can press play */ });
                }
                mediaEl.removeEventListener('loadedmetadata', resumePlayback);
              };
              mediaEl.addEventListener('loadedmetadata', resumePlayback);

              mediaEl.load();
            })
            .catch(function(err) {
              console.error('Failed to renew streaming URL:', err);
              showUnrecoverable();
            })
            .finally(function() {
              isReloading = false;
            });
        }

        mediaEl.addEventListener('error', function() {
          if (currentLightbox !== overlay) return;

          consecutiveErrorCount++;
          if (isReloading) return;

          if (consecutiveErrorCount > MAX_CONSECUTIVE_MEDIA_ERRORS) {
            showUnrecoverable();
            return;
          }

          reloadStream();
        });

        mediaEl.addEventListener('canplay', function() {
          consecutiveErrorCount = 0;
          clearStalledTimer();
        });

        mediaEl.addEventListener('progress', function() {
          clearStalledTimer();
        });

        mediaEl.addEventListener('stalled', function() {
          if (currentLightbox !== overlay) return;
          if (isReloading || stalledTimer !== undefined) return;

          stalledTimer = setTimeout(function() {
            stalledTimer = undefined;
            reloadStream();
          }, STALLED_DEBOUNCE_MS);
        });
      }

      function loadLightboxMedia(type, mediaID, overlay, content) {
        var oldError = overlay.querySelector('.lightbox-error');
        if (oldError && oldError.parentNode) oldError.parentNode.removeChild(oldError);
        var oldLoader = overlay.querySelector('.lightbox-loader');
        if (oldLoader && oldLoader.parentNode) oldLoader.parentNode.removeChild(oldLoader);

        clearLightboxAutoAdvance();

        ai.lbVideo = null;
        aiRenderLb(type, mediaID);

        var loader = createLoader();
        overlay.insertBefore(loader, content);
        content.style.display = 'none';

        // Load media from server
        if (type === 'video') {

          // Get temporary stream url
          authFetch('/api/media/' + mediaID + '/stream-url')
            .then(function(resp) {

              if (!resp.ok) {
                throw new Error('Failed to obtain stream URL');
              }

              return resp.json();

            })
            .then(function(streamData) {

              // Check if lightbox is still open
              if(currentLightbox !== overlay) return;


              var media = document.createElement('video');

              media.src = API_URL + streamData.url;
              media.controls = false;
              media.disablePictureInPicture = true;
              media.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
              media.autoplay = true;
              media.playsInline = true;
              media.preload = "metadata";

              media.style.display = 'block';

              // Clears the last content
              content.innerHTML = '';
              content.appendChild(media);

              aiBindLbVideo(media);

              media.addEventListener('click', function(ev) {
                if (ev.pointerType === 'touch') {
                  aiEl.classList.toggle('visible');
                  return;
                }
                if (media.paused || media.ended) media.play().catch(function(){});
                else media.pause();
              });

              attachStreamRecovery(media, mediaID, overlay);

              media.addEventListener('ended', function() {
                if (lb_autoplayEnabled) lightboxGoToNext();
              });


              // Remove loader and show content
              if(loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }

              content.style.display = 'flex';

              setupLightboxAutoAdvance(type);

            })
            .catch(function(err) {

              console.error('Failed to load video:', err);

              // Check if lightbox is still open
              if(currentLightbox !== overlay) return;

              if(loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }

              var errorState = createErrorState(
                i18n.t('errorMedia'),
                function() {
                  loadLightboxMedia(type, mediaID, overlay, content);
                }
              );

              overlay.appendChild(errorState);

            });


        } else if (type === 'image') {

          // Image uses a blob and is only shown once fully loaded; a loading screen is displayed until then.
          authFetch('/api/media/' + mediaID + '/file')
            .then(function(resp) {

              if (!resp.ok) {
                throw new Error('Failed to load media');
              }

              return resp.blob();

            })
            .then(function(blob) {

              // Check if lightbox is still open
              if(currentLightbox !== overlay) return;


              if (lb_lastBlobUrl) {
                window.URL.revokeObjectURL(lb_lastBlobUrl);
              }

              var blobUrl = window.URL.createObjectURL(blob);
              lb_lastBlobUrl = blobUrl;

              var media = document.createElement('img');

              media.src = blobUrl;
              media.alt = '';

              media.style.display = 'block';

              // Clears the last content
              content.innerHTML = '';
              content.appendChild(media);

              // Remove loader and show content
              if(loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }

              content.style.display = 'flex';

              setupLightboxAutoAdvance(type);

            })
            .catch(function(err) {

              console.error('Failed to load image:', err);

              // Check if lightbox is still open
              if(currentLightbox !== overlay) return;


              if(loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }

              var errorState = createErrorState(
                i18n.t('errorMedia'),
                function() {
                  loadLightboxMedia(type, mediaID, overlay, content);
                }
              );


              overlay.appendChild(errorState);

            });
        } else {
          closeLightbox();
        }
      }

      function openLightboxWithLoading(type, mediaID) {
        closeLightbox();

        if(type !== 'image' && type !== 'video') return;

        lb_navPlaylist = getSameTypePlaylist(type);
        lb_navIndex = findPlaylistIndex(lb_navPlaylist, mediaID);
        lb_currentType = type;
        lb_currentID = mediaID;

        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';

        var content = document.createElement('div');
        content.className = 'lightbox-content';
        content.style.display = 'none';
        overlay.appendChild(content);

        lb_pointerMoveHandler = function(ev){
          var clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
          var distFromBottom = window.innerHeight - clientY;
          var limit = aiEl.classList.contains('visible') ? (aiEl.offsetHeight + 40) : 110;
          aiEl.classList.toggle('visible', distFromBottom < limit);
        };

        lb_pointerDownHandler = function(ev){
          if(aiEl.contains(ev.target)){ lb_pointerDownX = null; return; }
          lb_pointerDownX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        };
        lb_pointerMoveCloseHandler = function(ev){
          if(lb_pointerDownX === null) return;
          var clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
          var delta = clientX - lb_pointerDownX;
          if(delta > 120){ closeLightbox(); }
        };
        lb_pointerUpHandler = function(){ lb_pointerDownX = null; };

        lb_fullscreenChangeHandler = function(){
          if(currentLightbox && !document.fullscreenElement){
            closeLightbox();
          }
        };

        document.body.appendChild(overlay);
        aiEnterLightbox(overlay);
        try{ if(overlay.requestFullscreen) overlay.requestFullscreen(); }catch(e){}
        overlay.focus && overlay.focus();

        document.addEventListener('mousemove', lb_pointerMoveHandler);
        document.addEventListener('touchmove', lb_pointerMoveHandler, { passive:true });
        document.addEventListener('touchstart', lb_pointerMoveHandler, { passive:true });
        document.addEventListener('pointerdown', lb_pointerDownHandler);
        document.addEventListener('pointermove', lb_pointerMoveCloseHandler);
        document.addEventListener('pointerup', lb_pointerUpHandler);
        document.addEventListener('fullscreenchange', lb_fullscreenChangeHandler);
        document.addEventListener('webkitfullscreenchange', lb_fullscreenChangeHandler);

        currentLightbox = overlay;
        document.addEventListener('keydown', onKeyClose);

        loadLightboxMedia(type, mediaID, overlay, content);
      }

      function closeLightbox(){
        if(!currentLightbox) return;
        aiLeaveLightbox();
        var v = currentLightbox.querySelector('video');
        if(v){ try{ v.pause(); v.removeAttribute('src'); v.load && v.load(); }catch(e){} }
        try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}

        clearLightboxAutoAdvance();
        if (lb_lastBlobUrl) {
          window.URL.revokeObjectURL(lb_lastBlobUrl);
          lb_lastBlobUrl = null;
        }
        lb_navPlaylist = [];
        lb_navIndex = -1;

        if(lb_pointerMoveHandler) document.removeEventListener('mousemove', lb_pointerMoveHandler);
        if(lb_pointerMoveHandler) document.removeEventListener('touchmove', lb_pointerMoveHandler);
        if(lb_pointerMoveHandler) document.removeEventListener('touchstart', lb_pointerMoveHandler);
        if(lb_pointerDownHandler) document.removeEventListener('pointerdown', lb_pointerDownHandler);
        if(lb_pointerMoveCloseHandler) document.removeEventListener('pointermove', lb_pointerMoveCloseHandler);
        if(lb_pointerUpHandler) document.removeEventListener('pointerup', lb_pointerUpHandler);
        if(lb_fullscreenChangeHandler) document.removeEventListener('fullscreenchange', lb_fullscreenChangeHandler);
        if(lb_fullscreenChangeHandler) document.removeEventListener('webkitfullscreenchange', lb_fullscreenChangeHandler);

        lb_pointerMoveHandler = lb_pointerDownHandler = lb_pointerMoveCloseHandler = lb_pointerUpHandler = lb_fullscreenChangeHandler = null;
        lb_pointerDownX = null;

        if(currentLightbox && currentLightbox.parentNode) currentLightbox.parentNode.removeChild(currentLightbox);
        currentLightbox = null;
        document.removeEventListener('keydown', onKeyClose);
      }

      // Player rendering and playback helpers
      function aiFmtTime(sec){
        if(!isFinite(sec) || sec < 0) sec = 0;
        var m = Math.floor(sec / 60);
        var r = Math.floor(sec % 60);
        return m + ':' + (r < 10 ? '0' : '') + r;
      }

      function aiFindMedia(id){
        return allMedias.find(function(m){ return String(m.ID) === String(id); }) || null;
      }

      function aiLabels(){
        aiRefs.shuffle.title = i18n.t('navShuffleTooltip');
        aiRefs.prev.title = i18n.t('navPrevTooltip');
        aiRefs.next.title = i18n.t('navNextTooltip');
        aiRefs.autoplay.title = i18n.t('navAutoplayTooltip');
        aiRefs.close.title = i18n.t('closeBtn');
        aiRefs.shuffle.setAttribute('aria-label', aiRefs.shuffle.title);
        aiRefs.prev.setAttribute('aria-label', aiRefs.prev.title);
        aiRefs.next.setAttribute('aria-label', aiRefs.next.title);
        aiRefs.autoplay.setAttribute('aria-label', aiRefs.autoplay.title);
        aiRefs.close.setAttribute('aria-label', aiRefs.close.title);
        aiPaintVolume();
      }

      function aiRenderStatic(){
        aiRefs.shuffle.innerHTML = AI_ICONS.shuffle;
        aiRefs.prev.innerHTML = AI_ICONS.prev;
        aiRefs.next.innerHTML = AI_ICONS.next;
        aiRefs.autoplay.innerHTML = AI_ICONS.autoplay;
        aiRefs.close.innerHTML = AI_ICONS.close;
        aiRefs.play.innerHTML = AI_ICONS.play;
        aiLabels();
      }

      // ----- Volume (compartilhado entre o player de áudio e o vídeo do lightbox) -----
      function aiApplyVolume(el){
        if(!el) return;
        el.volume = ai.volume;
        el.muted = ai.muted;
      }

      function aiPaintVolume(){
        var silent = ai.muted || ai.volume === 0;
        var pct = silent ? 0 : Math.round(ai.volume * 100);
        aiRefs.vol.value = pct;
        aiRefs.vol.style.setProperty('--ai-pct', pct + '%');
        aiRefs.mute.innerHTML = silent ? AI_ICONS.volMute : (ai.volume < 0.5 ? AI_ICONS.volLow : AI_ICONS.volHigh);
        var label = i18n.t(silent ? 'unmuteBtn' : 'muteBtn');
        aiRefs.mute.title = label;
        aiRefs.mute.setAttribute('aria-label', label);
      }

      function aiSaveVolume(){
        try {
          localStorage.setItem('wd_volume', String(ai.volume));
          localStorage.setItem('wd_muted', ai.muted ? 'true' : 'false');
        } catch(e) {}
      }

      function aiSetVolume(v, fromUser){
        ai.volume = Math.min(1, Math.max(0, v));
        if(fromUser) ai.muted = ai.volume === 0;
        aiApplyVolume(ai.audio);
        aiApplyVolume(ai.lbVideo);
        aiPaintVolume();
        aiSaveVolume();
      }

      function aiToggleMute(){
        if(ai.muted || ai.volume === 0){
          ai.muted = false;
          if(ai.volume === 0) ai.volume = 0.5;
        } else {
          ai.muted = true;
        }
        aiApplyVolume(ai.audio);
        aiApplyVolume(ai.lbVideo);
        aiPaintVolume();
        aiSaveVolume();
      }

      aiRefs.vol.addEventListener('input', function(){
        aiSetVolume(aiRefs.vol.value / 100, true);
      });
      aiRefs.mute.addEventListener('click', aiToggleMute);

      aiRenderStatic();
      document.addEventListener('i18n:change', aiLabels);

      function aiActiveEl(){ return ai.mode === 'lb' ? ai.lbVideo : ai.audio; }

      function aiSyncPrefs(){
        ai.autoplay = localStorage.getItem('wd_autoplayEnabled') === 'true';
        ai.shuffle = localStorage.getItem('wd_shuffleEnabled') === 'true';
        lb_autoplayEnabled = ai.autoplay;
        lb_shuffleEnabled = ai.shuffle;
      }

      function aiUpdateToggles(){
        var multi = (ai.mode === 'lb' ? lb_navPlaylist.length : ai.playlist.length) > 1;
        aiRefs.shuffle.classList.toggle('active', ai.shuffle);
        aiRefs.autoplay.classList.toggle('active', ai.autoplay);
        aiRefs.shuffle.disabled = !multi;
        aiRefs.autoplay.disabled = !multi;
        aiRefs.next.disabled = !multi;
        aiRefs.prev.disabled = (ai.mode === 'lb' && !ai.lbVideo && ai.lbHistory.length === 0);
      }

      function aiPaintPlayIcon(){
        var el = aiActiveEl();
        var playing = !!el && !el.paused && !el.ended;
        aiRefs.play.innerHTML = playing ? AI_ICONS.pause : AI_ICONS.play;
        aiRefs.play.setAttribute('aria-label', i18n.t(playing ? 'pauseBtn' : 'playBtn'));
      }

      function aiSyncMediaSession(){
        if(!('mediaSession' in navigator)) return;
        var playing = !ai.audio.paused && !ai.audio.ended;
        try { navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch(e) {}
      }

      function aiPaintTimes(){
        var el = aiActiveEl();
        var d = el ? el.duration : NaN;
        var t = el ? el.currentTime : 0;
        var pct = (isFinite(d) && d > 0) ? (t / d) * 100 : 0;
        aiRefs.seek.style.setProperty('--ai-pct', pct + '%');
        if(!ai.seeking){
          aiRefs.seek.value = Math.round(pct * 10);
          aiRefs.cur.textContent = aiFmtTime(t);
        }
        aiRefs.dur.textContent = aiFmtTime(d);
      }

      function aiMarkPlayingCard(){
        document.querySelectorAll('#gallery .card.playing').forEach(function(c){ c.classList.remove('playing'); });
        if(ai.currentID === null) return;
        var card = document.querySelector('#gallery .card[data-id="' + String(ai.currentID).replace(/"/g, '') + '"]');
        if(card) card.classList.add('playing');
      }
      window.aiMarkPlayingCardGlobal = aiMarkPlayingCard;
      window.aiCurrentIDGlobal = function(){ return ai.currentID; };

      function aiTypeIcon(type){
        return i18n.t(type === 'video' ? 'iconVideo' : (type === 'image' ? 'iconImage' : 'iconAudio'));
      }

      function aiSetCover(media, type){
        aiRefs.cover.innerHTML = '';
        if(media && media.Thumbnail){
          var img = document.createElement('img');
          img.src = API_URL + '/thumbs/' + media.Thumbnail;
          img.alt = '';
          img.onerror = function(){ aiRefs.cover.innerHTML = aiTypeIcon(type); };
          aiRefs.cover.appendChild(img);
        } else {
          aiRefs.cover.innerHTML = aiTypeIcon(type);
        }
      }

      function aiSetMeta(media, type, posLabel){
        var title = media ? media.Title : '';
        aiRefs.title.textContent = title;
        aiRefs.title.title = title;
        aiSetCover(media, type);
        aiRefs.sub.textContent = posLabel || '';
        if(type === 'audio' && 'mediaSession' in navigator && window.MediaMetadata){
          try { navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: 'Wireless Drive' }); } catch(e) {}
        }
      }

      function aiRenderAudio(){
        if(ai.mode !== 'audio') return;
        var media = aiFindMedia(ai.currentID);
        var pos = (ai.index >= 0 && ai.playlist.length > 0) ? (ai.index + 1) + ' / ' + ai.playlist.length : '';
        aiSetMeta(media, 'audio', pos);
        aiEl.classList.remove('lb-image', 'lb-video');
        aiUpdateToggles();
        aiPaintPlayIcon();
        aiPaintTimes();
      }

      function aiRenderLb(type, id){
        if(ai.mode !== 'lb') return;
        var media = aiFindMedia(id);
        var pos = (lb_navIndex >= 0 && lb_navPlaylist.length > 0) ? (lb_navIndex + 1) + ' / ' + lb_navPlaylist.length : '';
        aiSetMeta(media, type, pos);
        aiEl.classList.toggle('lb-image', type === 'image');
        aiEl.classList.toggle('lb-video', type === 'video');
        aiUpdateToggles();
        aiPaintPlayIcon();
        aiPaintTimes();
      }

      function aiBindLbVideo(v){
        ai.lbVideo = v;
        aiApplyVolume(v);
        function guard(fn){
          return function(){ if(ai.mode === 'lb' && ai.lbVideo === v) fn(); };
        }
        v.addEventListener('timeupdate', guard(aiPaintTimes));
        v.addEventListener('loadedmetadata', guard(aiPaintTimes));
        v.addEventListener('durationchange', guard(aiPaintTimes));
        v.addEventListener('play', guard(aiPaintPlayIcon));
        v.addEventListener('pause', guard(aiPaintPlayIcon));
        v.addEventListener('ended', guard(aiPaintPlayIcon));
        aiUpdateToggles();
        aiPaintPlayIcon();
        aiPaintTimes();
      }

      function aiEnterLightbox(overlay){
        ai.mode = 'lb';
        ai.lbVideo = null;
        ai.lbHistory = [];
        aiSyncPrefs();
        aiEl.classList.add('lb');
        aiEl.classList.remove('visible');
        aiEl.setAttribute('aria-hidden', 'false');
        overlay.appendChild(aiEl);
      }

      function aiLeaveLightbox(){
        if(ai.mode !== 'lb') return;
        ai.mode = 'audio';
        ai.lbVideo = null;
        ai.lbHistory = [];
        aiEl.classList.remove('lb', 'visible', 'lb-image', 'lb-video');
        document.body.appendChild(aiEl);
        aiEl.setAttribute('aria-hidden', ai.currentID === null ? 'true' : 'false');
        aiRenderAudio();
      }

      function aiShow(){
        aiEl.classList.add('open');
        if(ai.mode === 'audio') aiEl.setAttribute('aria-hidden', 'false');
        document.body.classList.add('has-island');
      }

      function aiClose(){
        ai.token++;
        ai.audio.pause();
        ai.audio.removeAttribute('src');
        ai.audio.load();
        ai.currentID = null;
        ai.playlist = [];
        ai.index = -1;
        ai.history = [];
        aiEl.classList.remove('open');
        aiEl.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('has-island');
        aiMarkPlayingCard();
        aiRenderAudio();
      }

      function aiPickNext(){
        if(ai.playlist.length <= 1) return null;
        if(ai.shuffle){
          var idx;
          do {
            idx = Math.floor(Math.random() * ai.playlist.length);
          } while(idx === ai.index);
          return ai.playlist[idx];
        }
        var nextIndex = ai.index >= 0 ? (ai.index + 1) % ai.playlist.length : 0;
        return ai.playlist[nextIndex];
      }

      function aiLoadAndPlay(id){
        var myToken = ++ai.token;
        ai.currentID = id;
        ai.index = findPlaylistIndex(ai.playlist, id);
        ai.errorCount = 0;
        ai.reloading = false;
        aiShow();
        aiRenderAudio();
        aiMarkPlayingCard();
        if(ai.mode === 'audio'){
          aiRefs.seek.value = 0;
          aiRefs.seek.style.setProperty('--ai-pct', '0%');
          aiRefs.cur.textContent = '0:00';
          aiRefs.dur.textContent = '0:00';
        }

        authFetch('/api/media/' + id + '/stream-url')
          .then(function(resp){
            if(!resp.ok) throw new Error('Failed to obtain stream URL');
            return resp.json();
          })
          .then(function(streamData){
            if(myToken !== ai.token) return;
            ai.audio.src = buildStreamSrc(streamData.url);
            ai.audio.play().catch(function(){ if(ai.mode === 'audio') aiPaintPlayIcon(); });
          })
          .catch(function(err){
            if(myToken !== ai.token) return;
            console.error('Failed to load audio:', err);
            showAppAlert(i18n.t('errorMedia'), 'error');
          });
      }

      function aiPlayNew(id){
        ai.playlist = getSameTypePlaylist('audio');
        ai.history = [];
        aiLoadAndPlay(id);
      }

      function aiGoNext(){
        var nextItem = aiPickNext();
        if(!nextItem) return;
        if(ai.currentID !== null) ai.history.push(ai.currentID);
        if(ai.history.length > 200) ai.history = ai.history.slice(ai.history.length - 200);
        aiLoadAndPlay(nextItem.id);
      }

      function aiGoPrev(){
        if(ai.audio.currentTime > 3 || ai.history.length === 0){
          ai.audio.currentTime = 0;
          if(ai.audio.paused) ai.audio.play().catch(function(){});
          return;
        }
        var prevId = ai.history.pop();
        aiLoadAndPlay(prevId);
      }

      function lightboxGoToPrev(){
        if(!currentLightbox) return;
        var v = ai.lbVideo;
        if(ai.lbHistory.length === 0 || (v && v.currentTime > 3)){
          if(v){
            v.currentTime = 0;
            if(v.paused) v.play().catch(function(){});
          }
          return;
        }
        var prevId = ai.lbHistory.pop();
        lb_navIndex = findPlaylistIndex(lb_navPlaylist, prevId);
        lb_currentID = prevId;
        loadLightboxMedia(lb_currentType, prevId, currentLightbox, currentLightbox.querySelector('.lightbox-content'));
      }

      // Controls (dispatch based on mode)
      aiRefs.play.addEventListener('click', function(){
        var el = aiActiveEl();
        if(!el) return;
        if(ai.mode === 'audio' && !ai.audio.src) return;
        if(el.paused || el.ended){
          el.play().catch(function(){});
        } else {
          el.pause();
        }
      });

      aiRefs.next.addEventListener('click', function(){
        if(ai.mode === 'lb') lightboxGoToNext(); else aiGoNext();
      });

      aiRefs.prev.addEventListener('click', function(){
        if(ai.mode === 'lb') lightboxGoToPrev(); else aiGoPrev();
      });

      aiRefs.close.addEventListener('click', function(){
        if(ai.mode === 'lb') closeLightbox(); else aiClose();
      });

      aiRefs.autoplay.addEventListener('click', function(){
        ai.autoplay = !ai.autoplay;
        lb_autoplayEnabled = ai.autoplay;
        localStorage.setItem('wd_autoplayEnabled', ai.autoplay ? 'true' : 'false');
        aiUpdateToggles();
        if(ai.mode === 'lb') setupLightboxAutoAdvance(lb_currentType);
      });

      aiRefs.shuffle.addEventListener('click', function(){
        ai.shuffle = !ai.shuffle;
        lb_shuffleEnabled = ai.shuffle;
        localStorage.setItem('wd_shuffleEnabled', ai.shuffle ? 'true' : 'false');
        aiUpdateToggles();
      });

      aiRefs.seek.addEventListener('input', function(){
        ai.seeking = true;
        var el = aiActiveEl();
        var d = el ? el.duration : NaN;
        if(isFinite(d) && d > 0){
          var t = (aiRefs.seek.value / 1000) * d;
          aiRefs.cur.textContent = aiFmtTime(t);
          aiRefs.seek.style.setProperty('--ai-pct', (aiRefs.seek.value / 10) + '%');
        }
      });

      aiRefs.seek.addEventListener('change', function(){
        var el = aiActiveEl();
        var d = el ? el.duration : NaN;
        if(isFinite(d) && d > 0){
          el.currentTime = (aiRefs.seek.value / 1000) * d;
        }
        ai.seeking = false;
      });

      ai.audio.addEventListener('timeupdate', function(){ if(ai.mode === 'audio') aiPaintTimes(); });
      ai.audio.addEventListener('loadedmetadata', function(){ if(ai.mode === 'audio') aiPaintTimes(); });
      ai.audio.addEventListener('durationchange', function(){ if(ai.mode === 'audio') aiPaintTimes(); });
      ai.audio.addEventListener('play', function(){ if(ai.mode === 'audio') aiPaintPlayIcon(); aiSyncMediaSession(); });
      ai.audio.addEventListener('pause', function(){ if(ai.mode === 'audio') aiPaintPlayIcon(); aiSyncMediaSession(); });
      ai.audio.addEventListener('ended', function(){
        if(ai.mode === 'audio') aiPaintPlayIcon();
        if(ai.autoplay) aiGoNext();
      });

      try {
        var aiVol = parseFloat(localStorage.getItem('wd_playerVolume'));
        if(!isNaN(aiVol) && aiVol >= 0 && aiVol <= 1) ai.audio.volume = aiVol;
        if(localStorage.getItem('wd_playerMuted') !== null){
          ai.audio.muted = localStorage.getItem('wd_playerMuted') === 'true';
        }
      } catch(e) {}
      ai.audio.addEventListener('volumechange', function(){
        try {
          localStorage.setItem('wd_playerVolume', String(ai.audio.volume));
          localStorage.setItem('wd_playerMuted', ai.audio.muted ? 'true' : 'false');
        } catch(e) {}
      });

      function aiReloadStream(){
        if(ai.reloading || ai.currentID === null) return;
        ai.reloading = true;
        if(ai.stalledTimer){ clearTimeout(ai.stalledTimer); ai.stalledTimer = null; }

        var myToken = ai.token;
        var id = ai.currentID;
        var resumeTime = ai.audio.currentTime;
        var wasPlaying = !ai.audio.paused && !ai.audio.ended;

        authFetch('/api/media/' + id + '/stream-url')
          .then(function(resp){
            if(!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
          })
          .then(function(streamData){
            if(myToken !== ai.token) return;
            ai.audio.src = buildStreamSrc(streamData.url);
            var resume = function(){
              ai.audio.currentTime = resumeTime;
              if(wasPlaying) ai.audio.play().catch(function(){});
              ai.audio.removeEventListener('loadedmetadata', resume);
            };
            ai.audio.addEventListener('loadedmetadata', resume);
            ai.audio.load();
          })
          .catch(function(err){
            console.error('Failed to renew streaming URL:', err);
            if(myToken === ai.token) showAppAlert(i18n.t('errorMedia'), 'error');
          })
          .finally(function(){ ai.reloading = false; });
      }

      ai.audio.addEventListener('error', function(){
        if(!ai.audio.getAttribute('src')) return;
        ai.errorCount++;
        if(ai.reloading) return;
        if(ai.errorCount > 3){
          showAppAlert(i18n.t('errorMedia'), 'error');
          return;
        }
        aiReloadStream();
      });
      ai.audio.addEventListener('canplay', function(){
        ai.errorCount = 0;
        if(ai.stalledTimer){ clearTimeout(ai.stalledTimer); ai.stalledTimer = null; }
      });
      ai.audio.addEventListener('progress', function(){
        if(ai.stalledTimer){ clearTimeout(ai.stalledTimer); ai.stalledTimer = null; }
      });
      ai.audio.addEventListener('stalled', function(){
        if(ai.reloading || ai.stalledTimer) return;
        ai.stalledTimer = setTimeout(function(){
          ai.stalledTimer = null;
          aiReloadStream();
        }, 2000);
      });

      if('mediaSession' in navigator){
        try {
          navigator.mediaSession.setActionHandler('play', function(){ ai.audio.play().catch(function(){}); });
          navigator.mediaSession.setActionHandler('pause', function(){ ai.audio.pause(); });
          navigator.mediaSession.setActionHandler('previoustrack', aiGoPrev);
          navigator.mediaSession.setActionHandler('nexttrack', aiGoNext);
        } catch(e) {}
      }

      function aiPauseForVideo(){
        if(!ai.audio.paused) ai.audio.pause();
      }

      // Gallery interaction handlers
      document.addEventListener('click', function(ev){
        var card = ev.target.closest('a.card');
        if(!card) return;
        ev.preventDefault();
        var type = card.getAttribute('data-type');
        var mediaID = card.getAttribute('data-id');

        if(type !== 'audio' && type !== 'image' && type !== 'video') return;

        if(type === 'audio'){
          aiPlayNew(mediaID);
          return;
        }

        if(type === 'video') aiPauseForVideo();
        openLightboxWithLoading(type, mediaID);
      });

      document.addEventListener('keydown', function(ev){
        if(ev.key !== 'Enter' && ev.key !== ' ') return;
        if(currentLightbox) return;
        var card = ev.target && ev.target.closest ? ev.target.closest('a.card') : null;
        if(!card || ev.target !== card) return;
        ev.preventDefault();
        card.click();
      });

      // Context-menu actions
      (function(){
        var ctxMenu = null;

        function closeCtxMenu(){
          if (ctxMenu && ctxMenu.parentNode) ctxMenu.parentNode.removeChild(ctxMenu);
          ctxMenu = null;
          document.removeEventListener('click', closeCtxMenu);
          document.removeEventListener('contextmenu', closeCtxMenuOnOtherRightClick, true);
          document.removeEventListener('keydown', ctxMenuKeyHandler);
          window.removeEventListener('scroll', closeCtxMenu, true);
        }

        function closeCtxMenuOnOtherRightClick(){
          closeCtxMenu();
        }

        function ctxMenuKeyHandler(ev){
          if (ev.key === 'Escape') closeCtxMenu();
        }

        function ctxMenuItem(label, onClick, opts){
          opts = opts || {};
          var item = document.createElement('div');
          item.className = 'ctx-menu-item' + (opts.danger ? ' danger' : '');
          item.textContent = label;
          item.addEventListener('click', function(e){
            e.stopPropagation();
            closeCtxMenu();
            onClick();
          });
          return item;
        }

        function downloadMedia(media){
          authFetch('/api/media/' + media.ID + '/stream-url?type=download')
            .then(function(resp){ return resp.json(); })
            .then(function(streamData){
              window.location.href = API_URL + streamData.url;
            })
            .catch(function(err){
              showAppAlert(i18n.t('errorDownloadFile') + err.message, 'error');
            });
        }

        function renameMedia(media){
          var overlay = document.createElement('div');
          overlay.className = 'rename-overlay';

          var modal = document.createElement('div');
          modal.className = 'rename-modal';

          var header = document.createElement('div');
          header.className = 'rename-modal-header';
          header.innerHTML = '<span class="rename-modal-icon">' + i18n.t('iconEdit') + '</span><h3>' + i18n.t('editTitleTooltip') + '</h3>';

          var label = document.createElement('label');
          label.textContent = i18n.t('labelTitle');

          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 255;
          input.value = media.Title || '';

          var errorEl = document.createElement('div');
          errorEl.className = 'rename-modal-error';

          var actions = document.createElement('div');
          actions.className = 'rename-modal-actions';

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'rn-cancel';
          cancelBtn.type = 'button';
          cancelBtn.textContent = i18n.t('btnCancel');

          var saveBtn = document.createElement('button');
          saveBtn.className = 'rn-save';
          saveBtn.type = 'button';
          saveBtn.innerHTML = i18n.t('btnSave');

          actions.appendChild(cancelBtn);
          actions.appendChild(saveBtn);

          modal.appendChild(header);
          modal.appendChild(label);
          modal.appendChild(input);
          modal.appendChild(errorEl);
          modal.appendChild(actions);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);

          input.focus();
          input.select();

          function close(){
            document.removeEventListener('keydown', onKeyDown);
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }

          function onKeyDown(ev){
            if (ev.key === 'Escape') close();
            if (ev.key === 'Enter') save();
          }

          function save(){
            var newTitle = input.value.trim();
            if (!newTitle) {
              errorEl.textContent = i18n.t('errorTitleEmpty');
              input.focus();
              return;
            }
            errorEl.textContent = '';
            saveBtn.disabled = true;
            var originalLabel = saveBtn.innerHTML;
            saveBtn.innerHTML = i18n.t('btnSaving');

            authFetch('/api/media/' + media.ID, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: newTitle })
            })
              .then(function(resp){
                return resp.json().then(function(data){
                  if (!resp.ok) throw new Error(data.error || data.message || i18n.t('errorUpdateMedia'));
                  return data;
                });
              })
              .then(function(){
                saveBtn.innerHTML = i18n.t('btnSaved');
                setTimeout(function(){
                  close();
                  loadMedias();
                }, 500);
              })
              .catch(function(err){
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalLabel;
                errorEl.textContent = i18n.t('errorUpdateMedia') + err.message;
              });
          }

          cancelBtn.addEventListener('click', close);
          saveBtn.addEventListener('click', save);
          overlay.addEventListener('mousedown', function(ev){
            if (ev.target === overlay) close();
          });
          document.addEventListener('keydown', onKeyDown);
        }

        function generateThumbForMedia(media){
          authFetch('/api/media/' + media.ID + '/generate-thumbnail', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          })
            .then(function(resp){
              return resp.json().then(function(data){
                if (!resp.ok) throw new Error(data.error || data.message || i18n.t('errorGenerateThumb'));
                return data;
              });
            })
            .then(function(){
              loadMedias();
              loadDiskUsage();
            })
            .catch(function(err){
              showAppAlert(i18n.t('errorGenerateThumb') + err.message, 'error');
            });
        }

        function deleteThumbForMedia(media){
          if (!confirm(i18n.t('confirmDeleteThumb'))) return;
          authFetch('/api/media/' + media.ID + '/delete-thumbnail', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
          })
            .then(function(resp){
              return resp.json().then(function(data){
                if (!resp.ok) throw new Error(data.error || data.message || i18n.t('errorDeleteThumb'));
                return data;
              });
            })
            .then(function(){
              loadMedias();
              loadDiskUsage();
            })
            .catch(function(err){
              showAppAlert(i18n.t('errorDeleteThumb') + err.message, 'error');
            });
        }

        function deleteMediaFromCtx(media){
          if (!confirm(i18n.t('confirmDeleteMedia'))) return;
          authFetch('/api/media/' + media.ID, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
          })
            .then(function(resp){ return resp.json(); })
            .then(function(data){
              if (data && data.message) {
                loadMedias();
                loadDiskUsage();
              } else {
                showAppAlert(i18n.t('errorDelete'), 'error');
              }
            })
            .catch(function(err){
              showAppAlert(i18n.t('errorDeleteWithMsg') + err.message, 'error');
            });
        }

        document.addEventListener('contextmenu', function(ev){
          var card = ev.target.closest('a.card');
          if (!card) return;
          ev.preventDefault();

          var id = card.getAttribute('data-id');
          var media = allMedias.find(function(m){ return String(m.ID) === String(id); });
          if (!media) return;

          closeCtxMenu();

          ctxMenu = document.createElement('div');
          ctxMenu.className = 'ctx-menu';

          ctxMenu.appendChild(ctxMenuItem(i18n.t('btnDownload'), function(){
            downloadMedia(media);
          }));

          ctxMenu.appendChild(ctxMenuItem(i18n.t('iconEdit') + ' ' + i18n.t('editTitleTooltip'), function(){
            renameMedia(media);
          }));

          if (media.Type === 'image' || media.Type === 'video') {
            ctxMenu.appendChild(ctxMenuItem(i18n.t('btnGenerateThumbnail'), function(){
              generateThumbForMedia(media);
            }));

            if (media.Thumbnail) {
              ctxMenu.appendChild(ctxMenuItem(i18n.t('btnDeleteThumbnail'), function(){
                deleteThumbForMedia(media);
              }));
            }
          }

          var sep = document.createElement('div');
          sep.className = 'ctx-menu-sep';
          ctxMenu.appendChild(sep);

          ctxMenu.appendChild(ctxMenuItem(i18n.t('deleteLink'), function(){
            deleteMediaFromCtx(media);
          }, { danger: true }));

          document.body.appendChild(ctxMenu);

          var menuWidth = ctxMenu.offsetWidth;
          var menuHeight = ctxMenu.offsetHeight;
          var x = ev.clientX;
          var y = ev.clientY;
          if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 8;
          if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight - 8;
          ctxMenu.style.left = Math.max(8, x) + 'px';
          ctxMenu.style.top = Math.max(8, y) + 'px';

          setTimeout(function(){
            document.addEventListener('click', closeCtxMenu);
            document.addEventListener('contextmenu', closeCtxMenuOnOtherRightClick, true);
            document.addEventListener('keydown', ctxMenuKeyHandler);
            window.addEventListener('scroll', closeCtxMenu, true);
          }, 0);
        });
      })();

      // Dashboard controls
      // Logout handler
      var logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('authToken');
          window.location.href = '/website/account';
        });

      }


      // Sort mode handler
      var sortBtn = document.getElementById('toggleSortBtn');
      if (sortBtn) {
        function updateSortButtonText() {
          var icon = i18n.t('iconSortDate');
          var label = i18n.t('sortByDate');

          switch(sortMode) {
            case 'asc':
              icon = i18n.t('iconSortAsc');
              label = i18n.t('sortAsc');
              break;
            case 'desc':
              icon = i18n.t('iconSortDesc');
              label = i18n.t('sortDesc');
              break;
            case 'date':
            default:
              icon = i18n.t('iconSortDate');
              label = i18n.t('sortByDate');
          }

          sortBtn.innerHTML = '<span id="sortIcon">' + icon + '</span> ' + label;
        }

        sortBtn.addEventListener('click', function(e) {
          e.preventDefault();

          // Cycle through sort modes: date -> asc -> desc -> date
          switch(sortMode) {
            case 'date':
              sortMode = 'asc';
              break;
            case 'asc':
              sortMode = 'desc';
              break;
            case 'desc':
              sortMode = 'date';
              break;
          }

          updateSortButtonText();
          // Reorder without API call, keeping the active search filter
          if (allMedias.length > 0) {
            applyFiltersAndRender();
          }
        });

        document.addEventListener('i18n:change', updateSortButtonText);
      }

      // Search handler
      var searchInput = document.getElementById('searchInput');
      var searchBox = document.getElementById('searchBox');
      var searchClear = document.getElementById('searchClear');

      if (searchInput) {
        searchInput.addEventListener('input', function() {
          searchQuery = searchInput.value.trim();
          searchBox.classList.toggle('has-value', searchQuery.length > 0);
          applyFiltersAndRender();
        });
      }

      if (searchClear) {
        searchClear.addEventListener('click', function() {
          searchQuery = '';
          searchInput.value = '';
          searchBox.classList.remove('has-value');
          searchInput.focus();
          applyFiltersAndRender();
        });
      }
    })();
  </script>
</body>
</html>
