<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arquivo - Media Gallery</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gradient-start: #a78bfa;
      --gradient-end: #c084fc;
      --bg-primary: #0a0a0f;
      --bg-secondary: #13111c;
      --bg-card: #1c1825;
      --accent: #a78bfa;
      --accent-hover: #c084fc;
      --accent-secondary: #e9d5ff;
      --text-primary: #f3f4f6;
      --text-secondary: #c4b5fd;
      --border: rgba(167, 139, 250, 0.2);
      --shadow: rgba(167, 139, 250, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(167, 139, 250, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: 
        linear-gradient(45deg, transparent 48%, rgba(167, 139, 250, 0.03) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(192, 132, 252, 0.03) 50%, transparent 52%);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, 30px) rotate(0deg); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .orb-1 {
      top: 10%;
      left: 10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.3), transparent 70%);
      animation-delay: 0s;
    }

    .orb-2 {
      bottom: 15%;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.3), transparent 70%);
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 24px;
      margin-bottom: 48px;
      background: linear-gradient(135deg, rgba(28, 24, 37, 0.95) 0%, rgba(19, 17, 28, 0.95) 100%);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 2px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 1px rgba(167, 139, 250, 0.5);
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      overflow: hidden;
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #a78bfa, #c084fc, #e9d5ff, #c084fc, #a78bfa);
      background-size: 300% 100%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .site-header h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      background: linear-gradient(135deg, #a78bfa 0%, #e9d5ff 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-header h1::before {
      content: '📸';
      font-size: 1.3em;
      filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.6));
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.8)); }
    }

    .site-header h1 a {
      text-decoration: none;
      background: linear-gradient(135deg, #a78bfa 0%, #e9d5ff 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-header nav {
      display: flex;
      gap: 12px;
    }

    .site-header nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .site-header nav a.back-link {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
    }

    .site-header nav a.delete-link {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .site-header nav a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }

    .site-header nav a:hover::before {
      left: 100%;
    }

    .site-header nav a.back-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(192, 132, 252, 0.6);
    }

    .site-header nav a.delete-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.6);
    }

    .site-header nav a:active {
      transform: translateY(-1px);
    }

    /* Main Content */
    main {
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.2s forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: linear-gradient(135deg, rgba(28, 24, 37, 0.95) 0%, rgba(19, 17, 28, 0.95) 100%);
      backdrop-filter: blur(10px);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #a78bfa, #c084fc, #e9d5ff, #c084fc, #a78bfa);
      background-size: 300% 100%;
      animation: gradientShift 4s ease infinite;
    }

    .card h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--text-primary);
      font-weight: 800;
      line-height: 1.2;
    }

    .muted {
      color: var(--text-secondary);
      opacity: 0.9;
      margin-bottom: 24px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .description {
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
      padding: 20px;
      background: rgba(167, 139, 250, 0.05);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      font-size: 1rem;
    }

    .file-icon {
      font-size: 5rem;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.08) 0%, rgba(192, 132, 252, 0.08) 100%);
      border-radius: 16px;
      margin: 24px 0;
      filter: drop-shadow(0 4px 20px rgba(167, 139, 250, 0.2));
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn.download {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white;
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
    }

    .btn.download:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(192, 132, 252, 0.6);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    a.download {
      display: inline-block;
      text-decoration: none;
    }

    .file-info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px solid rgba(167, 139, 250, 0.15);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .info-item {
      background: rgba(167, 139, 250, 0.05);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, 0.1);
    }

    .info-item strong {
      display: block;
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .info-item span {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .site-header {
        flex-direction: column;
        gap: 16px;
        text-align: center;
        padding: 20px;
        margin-bottom: 32px;
      }

      .site-header nav {
        width: 100%;
        flex-direction: column;
      }

      .site-header nav a {
        width: 100%;
        justify-content: center;
      }

      .card {
        padding: 28px;
        border-radius: 20px;
      }

      .card h1 {
        font-size: 1.6rem;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .file-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  
  <header class="site-header">
    <h1><a href="/">Media Gallery</a></h1>
    <nav>
      <a href="/website/dashboard" class="back-link">← Voltar</a>
      <a href="#" id="deleteBtn" class="delete-link">🗑️ Excluir</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h1 id="mediaTitle">Carregando...</h1>
      <div class="muted" id="mediaDate">📅 Carregando...</div>
      
      <div id="mediaDescription" style="display:none;color:var(--text-secondary);line-height:1.7;margin-bottom:24px;padding:20px;background:rgba(167,139,250,0.05);border-left:3px solid var(--accent);border-radius:8px;font-size:1rem;"></div>

      <div class="file-icon">📄</div>

      <div class="actions">
        <a class="download" href="#" id="downloadLink">
          <button class="btn download">⬇️ Baixar arquivo</button>
        </a>
      </div>

      <div class="file-info">
        <div class="info-item">
          <strong>Tipo</strong>
          <span id="mediaType">unknown</span>
        </div>
        <div class="info-item">
          <strong>Formato</strong>
          <span id="mediaMimeType">unknown</span>
        </div>
        <div class="info-item">
          <strong>ID</strong>
          <span id="mediaID">#0</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // API Configuration
    const API_URL = 'http://192.168.0.236:8085';

    // GSAP Animations
    window.addEventListener("DOMContentLoaded", function() {
      // Stagger header elements
      gsap.from(".site-header > *", {
        opacity: 0,
        y: 20,
        duration: 0.8,
        stagger: 0.1,
        ease: "power2.out",
        delay: 0.3
      });

      gsap.from('.card', {
        opacity: 0,
        y: 30,
        duration: 0.8,
        delay: 0.6,
        ease: 'power3.out'
      });

      gsap.from('.card > *', {
        opacity: 0,
        y: 15,
        duration: 0.6,
        stagger: 0.08,
        delay: 0.8,
        ease: 'power2.out'
      });

      // Format date in .muted
      document.querySelectorAll('.muted').forEach(function(el){
        var txt = el.textContent.replace(/^📅\s*/, '').trim();
        var d = new Date(txt);
        if(!isNaN(d.getTime())){
          var opts = { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' };
          try{
            el.textContent = '📅 ' + d.toLocaleString(undefined, opts);
          }catch(e){
            el.textContent = '📅 ' + d.toLocaleDateString();
          }
        }
      });

      // Load media data from API
      loadMediaData();
    });

    // Button hover effects
    var buttons = document.querySelectorAll('.btn, .site-header nav a');
    buttons.forEach(function(btn) {
      btn.addEventListener('mouseenter', function() {
        gsap.to(this, {
          scale: 1.05,
          duration: 0.3,
          ease: 'power2.out'
        });
      });

      btn.addEventListener('mouseleave', function() {
        gsap.to(this, {
          scale: 1,
          duration: 0.3,
          ease: 'power2.out'
        });
      });
    });

    // Helper para fazer requisições autenticadas
    async function authFetch(url, opts = {}) {
      const token = localStorage.getItem('authToken');
      const fullUrl = url.startsWith('http') ? url : API_URL + url;

      opts.headers = {
        ...(opts.headers || {}),
        ...(token ? { Authorization: 'Bearer ' + token } : {})
      };

      return fetch(fullUrl, opts);
    }

    // Extract media ID from URL
    function getMediaID() {
      const pathSegments = window.location.pathname.split('/');
      return pathSegments[pathSegments.length - 1];
    }

    // Load media data from API
    function loadMediaData() {
      const mediaID = getMediaID();
      
      authFetch('/api/media/' + mediaID)
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
          document.getElementById('mediaTitle').textContent = data.Title;
          document.getElementById('mediaDate').textContent = '📅 ' + new Date(data.CreatedAt).toLocaleString();
          document.getElementById('mediaType').textContent = data.Type;
          document.getElementById('mediaMimeType').textContent = data.MimeType;
          document.getElementById('mediaID').textContent = '#' + data.ID;
          
          if (data.Description) {
            document.getElementById('mediaDescription').textContent = data.Description;
            document.getElementById('mediaDescription').style.display = 'block';
          }
          
          const fileUrl = '/api/media/' + data.ID + '/file';
          document.getElementById('downloadLink').href = '#';
          document.getElementById('downloadLink').download = data.Filename;
          
          // Adiciona event listener para download com authFetch
          document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();
            downloadFileWithAuth(fileUrl, data.Filename);
          });
        })
        .catch(function(err) {
          console.error('Erro ao carregar mídia:', err);
          document.getElementById('mediaTitle').textContent = 'Erro ao carregar';
        });
    }
    
    // Download de arquivo com autenticação
    function downloadFileWithAuth(url, filename) {
      authFetch(url)
        .then(function(resp) { return resp.blob(); })
        .then(function(blob) {
          var blobUrl = window.URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename || 'download';
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(blobUrl);
          document.body.removeChild(a);
        })
        .catch(function(err) {
          alert('Erro ao baixar arquivo: ' + err.message);
        });
    }

    // Delete handler
    var deleteBtn = document.getElementById('deleteBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', function(e){
        e.preventDefault();
        if(!confirm('Tem certeza que deseja excluir este arquivo?')) return;
        
        const mediaID = getMediaID();
        
        authFetch('/api/media/' + mediaID, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        })
        .then(function(resp){ return resp.json(); })
        .then(function(data){ 
          if(data && data.message){ 
            window.location.href = '/website/dashboard'; 
          } else { 
            alert('Erro ao excluir'); 
          } 
        })
        .catch(function(e){ 
          alert('Erro ao excluir: ' + e.message); 
        });
      });
    }
  </script>
</body>
</html>
